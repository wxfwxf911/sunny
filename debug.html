<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>调试页 - 阳光二手集市</title>
<style>
body{font-family:sans-serif;padding:20px;background:#FFF8EC}
pre{background:#fff;padding:16px;border-radius:8px;overflow:auto}
.error{color:red}
.ok{color:green}
.step{margin:8px 0;padding:4px 8px;background:#fff;border-radius:4px}
</style>
</head>
<body>
<h1>🔍 调试信息</h1>
<div id="output"></div>

<script>
const out = document.getElementById('output');
function log(msg, cls) {
  out.innerHTML += '<div class="step ' + (cls||'') + '">' + msg + '</div>';
}

(async function() {
  log('🟢 1. 页面 JS 开始执行', 'ok');
  log('📂 2. 开始加载 data.json...');
  try {
    const resp = await fetch('data.json?t=' + Date.now());
    log('📡 3. HTTP 状态: ' + resp.status + ' ' + resp.statusText, resp.ok ? 'ok' : 'error');
    const data = await resp.json();
    log('📦 4. data.json 版本: v' + (data.version || '?'));
    log('📦 5. 商品数量: ' + (data.items ? data.items.length : 'undefined'));
    log('📦 6. 分类数量: ' + (data.categories ? data.categories.length : 'undefined'));
    log('📦 7. 管理密码: ' + ((data._config && data._config.admin_pwd) ? data._config.admin_pwd : '未设置'));
    
    if (data.items && data.items.length > 0) {
      log('<b>✅ 数据加载成功！商品列表：</b>', 'ok');
      data.items.forEach((item, i) => {
        log('&nbsp;&nbsp;' + (i+1) + '. [' + item.category + '] ' + item.title + ' — ¥' + item.price);
      });
    } else {
      log('<b>❌ 商品列表为空！</b>', 'error');
    }
    
    log('<hr><b>8. localStorage 检查：</b>');
    log('&nbsp;&nbsp;sunny_items: ' + (localStorage.getItem('sunny_items') ? '已存在 ✅' : '空 ❌'), localStorage.getItem('sunny_items') ? 'ok' : 'error');
    log('&nbsp;&nbsp;sunny_server_ver: ' + (localStorage.getItem('sunny_server_ver') || '空'));
    log('&nbsp;&nbsp;sunny_admin_pwd: ' + (localStorage.getItem('sunny_admin_pwd') || '空'));
    log('&nbsp;&nbsp;sunny_categories: ' + (localStorage.getItem('sunny_categories') || '空'));
    log('&nbsp;&nbsp;sunny_github_token: ' + (localStorage.getItem('sunny_github_token') ? '已设置' : '空（使用默认Token）'));
    
  } catch(e) {
    log('<b>❌ 加载失败: ' + e.message + '</b>', 'error');
    log('URL: ' + window.location.href);
    log('请检查控制台 (F12) 查看详细错误');
  }
  
  log('<hr><b>✅ 调试完成</b>', 'ok');
})();
</script>
</body>
</html>
