<style>
/* ========== Reset & Base ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --orange: #FF6B35;
  --yellow: #FFD700;
  --pink: #FF6B8A;
  --teal: #00D2A0;
  --bg: #FFF8EC;
  --card: #FFFFFF;
  --text: #2D1B00;
  --text-light: #7A6652;
  --shadow: 0 4px 20px rgba(255, 107, 53, 0.12);
  --shadow-hover: 0 12px 36px rgba(255, 107, 53, 0.22);
  --radius: 16px;
  --radius-sm: 10px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse at 10% 0%, rgba(255, 184, 77, 0.25) 0%, transparent 50%),
    radial-gradient(ellipse at 90% 100%, rgba(255, 107, 138, 0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(255, 215, 0, 0.08) 0%, transparent 60%);
}

/* ========== Header ========== */
.header {
  background: linear-gradient(135deg, #FF6B35, #FF8C42, #FF6B35);
  padding: 16px 0;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 4px 24px rgba(255, 107, 53, 0.35);
}
.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 26px;
  font-weight: 800;
  color: #fff;
  text-decoration: none;
  letter-spacing: 2px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.15);
  white-space: nowrap;
}
.logo-icon {
  width: 44px; height: 44px;
  background: var(--yellow);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
  box-shadow: 0 3px 12px rgba(255,215,0,0.5);
}
.search-wrap {
  flex: 1;
  min-width: 200px;
  position: relative;
}
.search-input {
  width: 100%;
  padding: 12px 48px 12px 20px;
  border: none;
  border-radius: 50px;
  font-size: 15px;
  background: rgba(255,255,255,0.95);
  color: var(--text);
  outline: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  transition: box-shadow 0.2s;
}
.search-input:focus { box-shadow: 0 0 0 3px rgba(255,215,0,0.5), 0 4px 16px rgba(0,0,0,0.1); }
.search-btn {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  width: 36px; height: 36px;
  border: none; background: var(--yellow);
  border-radius: 50%;
  font-size: 16px;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.search-btn:hover { transform: translateY(-50%) scale(1.08); box-shadow: 0 3px 12px rgba(255,215,0,0.5); }

.btn-add {
  padding: 12px 28px;
  background: #fff;
  color: var(--orange);
  border: none;
  border-radius: 50px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  transition: transform 0.15s, box-shadow 0.15s;
  white-space: nowrap;
}
.btn-add:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.18); }

.btn-admin {
  padding: 12px 20px;
  background: rgba(255,255,255,0.25);
  color: #fff;
  border: 2px solid rgba(255,255,255,0.5);
  border-radius: 50px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn-admin:hover { background: rgba(255,255,255,0.4); }
.btn-admin.active { background: #fff; color: var(--orange); border-color: #fff; }

.btn-share {
  padding: 12px 20px;
  background: rgba(255,255,255,0.25);
  color: #fff;
  border: 2px solid rgba(255,255,255,0.5);
  border-radius: 50px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn-share:hover { background: rgba(255,255,255,0.4); }

/* Share Modal */
.share-options {
  display: flex; flex-direction: column; gap: 12px;
}
.share-link-row {
  display: flex; gap: 8px;
}
.share-link-input {
  flex: 1; padding: 10px 14px;
  border: 2px solid #e8ddd0; border-radius: var(--radius-sm);
  font-size: 13px; background: #fafafa; color: var(--text);
}
.btn-copy {
  padding: 10px 20px; background: var(--orange); color: #fff;
  border: none; border-radius: var(--radius-sm);
  font-weight: 700; cursor: pointer;
  white-space: nowrap; transition: transform 0.15s;
}
.btn-copy:hover { transform: scale(1.03); }
.qr-wrap {
  text-align: center; padding: 10px;
}
.qr-wrap img {
  border: 1px solid #f0e8db; border-radius: var(--radius-sm);
}

/* ========== Category Bar ========== */
.cat-bar {
  max-width: 1200px;
  margin: 24px auto 0;
  padding: 0 20px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.cat-btn {
  padding: 10px 22px;
  border: 2px solid #e8ddd0;
  border-radius: 50px;
  background: #fff;
  color: var(--text-light);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.cat-btn:hover { border-color: var(--orange); color: var(--orange); }
.cat-btn.active {
  background: var(--orange);
  color: #fff;
  border-color: var(--orange);
  box-shadow: 0 4px 14px rgba(255,107,53,0.35);
}
.cat-btn { position: relative; }
.cat-del {
  position: absolute; top: -6px; right: -6px;
  width: 20px; height: 20px;
  background: #f44336; color: #fff;
  border-radius: 50%;
  font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  line-height: 1;
}
.cat-del:hover { background: #d32f2f; transform: scale(1.15); }
.cat-add-wrap {
  display: inline-flex; gap: 6px; align-items: center;
}
.cat-add-input {
  width: 120px; padding: 8px 12px;
  border: 2px dashed #e8ddd0;
  border-radius: 50px;
  font-size: 14px;
  outline: none;
  background: #fff;
  transition: border-color 0.2s;
}
.cat-add-input:focus { border-color: var(--orange); border-style: solid; }
.cat-add-btn {
  padding: 8px 16px;
  background: var(--teal);
  color: #fff;
  border: none;
  border-radius: 50px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: transform 0.15s;
}
.cat-add-btn:hover { transform: scale(1.05); }

/* ========== Main Grid ========== */
.main { max-width: 1200px; margin: 0 auto; padding: 28px 20px 60px; }
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 22px;
}
@media (max-width: 1000px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 680px)  { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 440px)  { .grid { grid-template-columns: 1fr; } }

.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 80px 20px;
  color: var(--text-light);
}
.empty-state .icon { font-size: 64px; margin-bottom: 16px; }
.empty-state h3 { font-size: 20px; margin-bottom: 8px; color: var(--text); }
/* ========== Product Card ========== */
.card {
  background: #fff;
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: transform 0.25s, box-shadow 0.25s;
  cursor: pointer;
  display: flex; flex-direction: column;
}
.card:hover { transform: translateY(-6px); box-shadow: var(--shadow-hover); }

.card-img {
  height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 64px;
  position: relative;
  overflow: hidden;
}
.card-img img {
  width: 100%; height: 100%;
  object-fit: cover;
  position: absolute; top: 0; left: 0;
}
.card-img .placeholder {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
}
.card-category {
  position: absolute; top: 10px; right: 10px;
  background: rgba(0,0,0,0.5);
  color: #fff;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
}
.card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
.card-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-price { font-size: 22px; font-weight: 800; color: var(--orange); margin-bottom: 8px; display: flex; align-items: baseline; gap: 2px; flex-wrap: wrap; }
.card-price .unit { font-size: 14px; font-weight: 600; }
.card-price small { color: #c98860; }
.card-desc { font-size: 13px; color: var(--text-light); line-height: 1.5; flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 10px; }
.card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #b8a590; padding-top: 10px; border-top: 1px solid #f5efe6; }
.card-footer .contact-btn {
  padding: 6px 14px;
  background: var(--pink);
  color: #fff;
  border: none;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s;
}
.card-footer .contact-btn:hover { transform: scale(1.06); }

/* Admin action buttons on cards */
.card-actions {
  position: absolute; top: 10px; left: 10px;
  display: none; gap: 6px; z-index: 2;
}
.admin-mode .card-actions { display: flex; }
.btn-edit, .btn-delete {
  width: 32px; height: 32px;
  border: none; border-radius: 50%;
  font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.15s;
}
.btn-edit { background: #2196F3; color: #fff; }
.btn-delete { background: #f44336; color: #fff; }
.btn-edit:hover, .btn-delete:hover { transform: scale(1.15); }

/* ========== Modal ========== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  animation: fadeIn 0.2s;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
.modal {
  background: #fff;
  border-radius: var(--radius);
  max-width: 520px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  animation: slideUp 0.25s;
}
.modal-header {
  padding: 20px 24px;
  border-bottom: 1px solid #f0e8db;
  display: flex; justify-content: space-between; align-items: center;
  position: sticky; top: 0; background: #fff;
  border-radius: var(--radius) var(--radius) 0 0;
  z-index: 1;
}
.modal-header h2 { font-size: 20px; }
.modal-close {
  width: 36px; height: 36px;
  border: none; background: #f5efe6;
  border-radius: 50%;
  font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.modal-close:hover { background: #e8ddd0; }
.modal-body { padding: 24px; }

/* ========== Detail Modal ========== */
.detail-img {
  width: 100%; height: 280px;
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 80px;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}
.detail-img img {
  width: 100%; height: 100%;
  object-fit: cover;
  position: absolute; top: 0; left: 0;
}
.detail-price { font-size: 30px; font-weight: 800; color: var(--orange); margin-bottom: 6px; }
.detail-meta { display: flex; gap: 16px; font-size: 13px; color: var(--text-light); margin-bottom: 16px; flex-wrap: wrap; }
.detail-desc { font-size: 15px; line-height: 1.7; color: var(--text); margin-bottom: 20px; }
.detail-contact {
  padding: 16px;
  background: #FFF7F0;
  border-radius: var(--radius-sm);
  text-align: center;
  border: 1px dashed #FFB88C;
}
.detail-contact .label { font-size: 13px; color: var(--text-light); margin-bottom: 4px; }
.detail-contact .info { font-size: 18px; font-weight: 700; color: var(--orange); }

/* ========== Form ========== */
.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid #e8ddd0;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-family: inherit;
  background: #fff;
  transition: border-color 0.2s;
  outline: none;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus { border-color: var(--orange); }
.form-group textarea { resize: vertical; min-height: 80px; }

.upload-area {
  border: 2px dashed #e8ddd0;
  border-radius: var(--radius-sm);
  padding: 24px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  position: relative;
}
.upload-area:hover { border-color: var(--orange); background: #FFF7F0; }
.upload-area .icon { font-size: 40px; margin-bottom: 8px; }
.upload-area .text { font-size: 13px; color: var(--text-light); }
.upload-area input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.upload-preview { width: 100%; height: 180px; object-fit: cover; border-radius: var(--radius-sm); margin-top: 10px; display: none; }
.upload-preview-wrap { position: relative; margin-top: 10px; display: none; }
.upload-preview-wrap .upload-preview { width: 100%; height: 180px; object-fit: cover; border-radius: var(--radius-sm); margin-top: 0; display: block; }
.btn-remove-img { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; border: none; background: rgba(0,0,0,0.55); color: #fff; font-size: 16px; cursor: pointer; line-height: 28px; text-align: center; padding: 0; z-index: 1; }
.btn-remove-img:hover { background: rgba(255,0,0,0.7); }

.btn-submit {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--orange), #FF8C42);
  color: #fff;
  border: none;
  border-radius: 50px;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(255,107,53,0.35);
  transition: transform 0.15s, box-shadow 0.15s;
}
.btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 26px rgba(255,107,53,0.45); }

.form-error { color: #e74c3c; font-size: 13px; margin-top: 4px; display: none; }

/* ========== Footer ========== */
.footer {
  text-align: center;
  padding: 28px 20px;
  color: var(--text-light);
  font-size: 13px;
  border-top: 1px solid #f0e8db;
  max-width: 1200px;
  margin: 0 auto;
}

/* ========== Toast ========== */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: var(--teal);
  color: #fff;
  padding: 14px 28px;
  border-radius: 50px;
  font-weight: 700;
  z-index: 999;
  box-shadow: 0 6px 24px rgba(0,210,160,0.4);
  animation: slideUp 0.3s;
}
</style>
</head>
<body>

<!-- ==================== Header ==================== -->
<header class="header">
  <div class="header-inner">
    <a href="#" class="logo" onclick="resetAll()">
      <div class="logo-icon">☀️</div>
      阳光二手集市
    </a>
    <div class="search-wrap">
      <input class="search-input" type="text" placeholder="🔍 搜一搜你想要的好物..." id="searchInput" oninput="renderList()">
      <button class="search-btn" onclick="renderList()">🔍</button>
    </div>
    <button class="btn-add" onclick="openAddModal()">+ 发布物品</button>
    <button class="btn-admin" id="btnAdmin" onclick="toggleAdmin()">⚙️ 管理</button>
    <button class="btn-admin" id="btnChangePwd" onclick="openChangePwdModal()" style="display:none">🔑 改密</button>
    <button class="btn-admin" id="btnExport" onclick="exportUserItems()" style="display:none">💾 导出</button>
    <span id="syncStatus" style="color:#90EE90;font-size:12px;font-weight:600">🟢 自动同步</span>
    <button class="btn-admin" id="btnSync" onclick="manualSync()">🔄 同步</button>
    <button class="btn-share" onclick="openShareModal()">📤 分享</button>
  </div>
</header>

<!-- ==================== Category Bar ==================== -->
<div class="cat-bar" id="catBar">
  <!-- JS fills -->
</div>

<!-- ==================== Main Content ==================== -->
<div class="main">
  <div class="grid" id="grid">
    <!-- JS fills -->
  </div>
</div>

<!-- ==================== Footer ==================== -->
<div class="footer">☀️ 阳光二手集市 — 让闲置焕发新生 ✨ &nbsp; <span style="color:#ccc;font-size:11px">v2.3</span></div>

<!-- ==================== Detail Modal ==================== -->
<div class="modal-overlay" id="detailModal" style="display:none" onclick="if(event.target===this)closeDetail()">
  <div class="modal">
    <div class="modal-header">
      <h2>📦 物品详情</h2>
      <button class="modal-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
  </div>
</div>

<!-- ==================== Add Modal ==================== -->
<div class="modal-overlay" id="addModal" style="display:none" onclick="if(event.target===this)closeAddModal()">
  <div class="modal">
    <div class="modal-header">
      <h2>📝 发布闲置物品</h2>
      <button class="modal-close" onclick="closeAddModal()">✕</button>
    </div>
    <div class="modal-body">
      <form id="addForm" onsubmit="submitItem(event)">
        <div class="form-group">
          <label>物品标题 *</label>
          <input type="text" id="formTitle" placeholder="给物品起个名字吧" required maxlength="50">
        </div>
        <div class="form-group">
          <label>分类 *</label>
          <select id="formCategory" required>
            <option value="">请选择分类</option>
            <option value="数码">数码</option>
            <option value="家具">家具</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <div class="form-group">
          <label>价格 *</label>
          <div style="display:flex; gap:8px;">
            <input type="number" id="formPrice" placeholder="¥ 输入价格" required min="0" max="9999999" step="0.01" style="flex:1;">
            <input type="text" id="formUnit" placeholder="单位，如 元/件" list="unitList" style="width:140px;flex-shrink:0;" maxlength="10">
            <datalist id="unitList">
              <option value="元/件">
              <option value="元/斤">
              <option value="元/套">
              <option value="元/本">
              <option value="元/双">
              <option value="元/个">
              <option value="元/台">
              <option value="元/张">
              <option value="元/包">
              <option value="元/箱">
            </datalist>
          </div>
        </div>
        <div class="form-group">
          <label>物品描述</label>
          <textarea id="formDesc" placeholder="描述一下物品的成色、使用时长、购买渠道等..." maxlength="500"></textarea>
        </div>
        <div class="form-group">

<div class="toast" id="toast" style="display:none"></div>

<script>
"use strict";

// ═══════════════════════════════════════
// 配置常量（改这里影响全局）
// ═══════════════════════════════════════
var CONFIG = {
  SYNC_INTERVAL: 30000,      // 自动同步间隔（毫秒）
  MAX_DESC_LENGTH: 500,      // 描述最大字数
  MIN_PWD_LENGTH: 4,         // 密码最小长度
  MAX_PRICE: 9999999,        // 最大价格
  SEARCH_DEBOUNCE: 250       // 搜索输入防抖（毫秒）
};

// ═══════════════════════════════════════
// XSS 防护：HTML 转义
// ═══════════════════════════════════════
// JS 字符串转义（用于 onclick 等属性）
function escapeJs(s) { return s.replace(/\\/g, "\\\\").replace(/'/g, "\\'"); }

function escapeHtml(str) {
  var div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// ═══════════════════════════════════════
// 密码哈希（SHA-256 via Web Crypto）
// ═══════════════════════════════════════
function sha256(str) {
  var encoder = new TextEncoder();
  var data = encoder.encode(str);
  return crypto.subtle.digest("SHA-256", data).then(function (hash) {
    return Array.from(new Uint8Array(hash))
      .map(function (b) { return b.toString(16).padStart(2, "0"); })
      .join("");
  });
}

// ═══════════════════════════════════════
// Toast 通知（替代 alert）
// ═══════════════════════════════════════
function showToast(msg) {
  var t = document.getElementById("toast");
  if (!t) return;
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(t._timeout);
  t._timeout = setTimeout(function () {
    t.style.display = "none";
  }, 2000);
}

var DATA={"version":4,"items":[{"title":"吸顶喇叭","category":"音响","price":30,"unit":"元/个","desc":"惠威吸顶喇叭，八成新","contact":"13882591912","image":"https://wxfwxf911.github.io/sunny/images/img_1779455623065_0.jpg","time":"刚刚"},{"title":"电脑显示屏","category":"数码","price":150,"unit":"元/台","desc":"21寸三星电脑显示屏，八成新","contact":"13882591912","image":"https://wxfwxf911.github.io/sunny/images/img_1779455625423_1.jpg","time":"刚刚"},{"title":"汽车轮胎","category":"汽配","price":80,"unit":"元/只","desc":"原车拆件，保证正品，八成新","contact":"13882591912","image":"https://wxfwxf911.github.io/sunny/images/img_1779415700989_0.jpg","time":"刚刚"},{"title":"惠威吸顶喇叭+先科功放","category":"音响","price":280,"unit":"元/套","desc":"惠威TD206吸顶喇叭（3只），正品，八成新，声音清脆，带先科SA-9006功放适合100平米的商铺，做背景音乐系统。","contact":"13882591912","image":"https://wxfwxf911.github.io/sunny/images/img_1779415703243_1.jpg","time":"刚刚"},{"title":"拼接屏","category":"音响","price":1680,"unit":"元人民币/台","desc":"2X2 共四块屏，单屏48寸，七成新，画质清晰特别适合酒吧，KTV，会议室使用","contact":"13882591912","image":"https://wxfwxf911.github.io/sunny/images/img_1779415704822_2.jpg","time":"今天"}],"categories":["全部","数码","家具","音响","其他","汽配"],"admin_pwd":"240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9"};

// 密码迁移：如果 admin_pwd 不是 64 位 hex（SHA-256），自动转为哈希
function migratePwd(){if(DATA.admin_pwd&&DATA.admin_pwd.length!==64){sha256(DATA.admin_pwd).then(function(h){DATA.admin_pwd=h;saveLocal();console.log("🔐 密码已自动哈希")})}}
migratePwd();

// 从 localStorage 恢复上次未同步的数据（防止刷新丢失）
(function(){
  try{var b=JSON.parse(localStorage.getItem("sunny_bak"));if(b&&b.version&&b.items&&b.items.length>DATA.items.length){DATA=b;migratePwd()} }catch(e){}
})();

var currentCat="全部", items=DATA.items, isAdmin=false, uploadedImage="", editingIdx=-1;

// ==================== GitHub 同步 ====================
// ⚠️ 安全提示：Token 仅在客户端混淆，F12 可逆向。生产环境建议用 Serverless Function (Cloudflare Workers / Vercel) 代理 API 请求。
var _tk=[20,29,30,49,42,21,49,4,93,11,42,45,56,33,17,31,69,0,94,9,26,56,54,89,42,67,71,28,9,61,20,37,29,2,72,22,22,11,7,1];
var GH=_tk.map(function(c,i){return String.fromCharCode(c^"sunny".charCodeAt(i%5))}).join("");

// 本地备份：每次数据变更时自动保存到 localStorage，防止刷新丢失
function saveLocal(){try{localStorage.setItem("sunny_bak",JSON.stringify(DATA))}catch(e){}}

function syncToGitHub(msg){
  return new Promise(function(resolve){
    var d=JSON.stringify({version:(DATA.version||4)+1,items:DATA.items,categories:DATA.categories,_config:{admin_pwd:DATA.admin_pwd}},null,2);
    var b=btoa(encodeURIComponent(d).replace(/%([0-9A-F]{2})/g,function(_,p1){return String.fromCharCode("0x"+p1)}));
    fetch("https://api.github.com/repos/wxfwxf911/sunny/contents/data.json",{headers:{Authorization:"token "+GH,"Content-Type":"application/json",Accept:"application/vnd.github.v3+json"}})
    .then(function(r){return r.json()})
    .then(function(fd){
      return fetch("https://api.github.com/repos/wxfwxf911/sunny/contents/data.json",{
        method:"PUT",headers:{Authorization:"token "+GH,"Content-Type":"application/json"},
        body:JSON.stringify({message:msg||"🔄 自动同步",content:b,sha:fd.sha})
      });
    })
    .then(function(r){if(r.ok){DATA.version=(DATA.version||4)+1;saveLocal();console.log("✅ 同步成功");resolve(true)}else{console.warn("同步失败:",r.status);resolve(false)}})
    .catch(function(e){console.warn("同步失败:",e.message);resolve(false)});
  });
}

function loadFromServer(){
  fetch("data.json?t="+Date.now())
  .then(function(r){return r.json()})
  .then(function(d){
    var sv=d.version||0;
    if(sv>DATA.version||(d.items&&d.items.length>DATA.items.length)){
      DATA.version=sv;
      DATA.items=d.items;
      items=DATA.items;
      if(d.categories&&d.categories.length>0) DATA.categories=d.categories;
      if(d._config&&d._config.admin_pwd) DATA.admin_pwd=d._config.admin_pwd;
      renderCatBar();renderList();
      console.log("✅ 服务器数据已同步 v"+sv);
    }
  }).catch(function(){/* 静默失败，不影响本地使用 */});
}

function renderList(){
  var s=(document.getElementById("searchInput")||{}).value||"";
  var f=items;
  if(currentCat!=="全部") f=items.filter(function(i){return i.category===currentCat});
  if(s){s=s.toLowerCase();f=f.filter(function(i){return i.title.toLowerCase().indexOf(s)>=0})}
  var g=document.getElementById("grid");
  if(!g) return;
  if(f.length===0){g.innerHTML='<div class="empty-state"><div class="icon">📭</div><h3>暂无商品</h3></div>';return}
  var cc=["#FFE0B2,#FFCC80","#FFCDD2,#EF9A9A","#C8E6C9,#A5D6A7","#BBDEFB,#90CAF9","#E1BEE7,#CE93D8","#FFE082,#FFD54F"];
  g.innerHTML=f.map(function(item,idx){
    var bg=cc[idx%cc.length];
    var im=item.image?'<img src="'+escapeHtml(item.image)+'" style="width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0" onerror="this.style.display=\'none\';var p=this.parentElement.querySelector(\'.placeholder\');if(p)p.style.display=\'flex\'" loading="lazy">':'<div class="placeholder" style="font-size:48px">📦</div>';
    var delBtn=isAdmin?'<div class="card-actions" style="display:flex;position:absolute;top:8px;left:8px;z-index:2;gap:6px"><button onclick="event.stopPropagation();editItem('+idx+')" style="width:28px;height:28px;border-radius:50%;border:none;background:#2196F3;color:#fff;font-size:14px;cursor:pointer" title="编辑">✎</button><button onclick="event.stopPropagation();delItem('+idx+')" style="width:28px;height:28px;border-radius:50%;border:none;background:#f44336;color:#fff;font-size:14px;cursor:pointer" title="删除">✕</button></div>':'';
    return '<div class="card" onclick="showDetail('+idx+')"><div class="card-img" style="background:linear-gradient(135deg,'+bg+')">'+delBtn+im+'<div class="card-category">'+escapeHtml(item.category)+'</div></div><div class="card-body"><div class="card-title">'+escapeHtml(item.title)+'</div><div class="card-price">¥'+item.price+'<span class="unit">'+escapeHtml(item.unit||"")+'</span></div><div class="card-desc">'+escapeHtml(item.desc||"")+'</div><div class="card-footer"><span>'+escapeHtml(item.contact)+'</span></div></div></div>';
  }).join("")
}

function renderCatBar(){
  var b=document.getElementById("catBar");
  if(!b) return;
  b.innerHTML=DATA.categories.map(function(c){return '<button class="cat-btn'+(c===currentCat?" active":"")+'" onclick="selectCat(\''+escapeJs(c)+'\')">'+escapeHtml(c)+'</button>'}).join("");
  if(isAdmin){
    b.innerHTML+='<span class="cat-add-wrap"><input class="cat-add-input" id="newCatInput" placeholder="新分类"><button class="cat-add-btn" onclick="addCat()">+添加</button></span>';
  }
}

function selectCat(c){currentCat=c;renderCatBar();renderList()}
function addCat(){var i=document.getElementById("newCatInput");var n=(i.value||"").trim();if(!n||DATA.categories.indexOf(n)>=0)return;DATA.categories.push(n);i.value="";renderCatBar();syncToGitHub("🏷️ 添加分类: "+n)}

function showDetail(idx){
  var item=items[idx];
  if(!item) return;
  var di=document.getElementById("detailBody");
  di.innerHTML=(item.image?'<div class="detail-img"><img src="'+escapeHtml(item.image)+'" onerror="this.style.display=\'none\';this.parentElement.textContent=\'📦\'"></div>':'<div class="detail-img" style="background:linear-gradient(135deg,#FFE0B2,#FFCC80);font-size:80px">📦</div>')+
    '<h2>'+escapeHtml(item.title)+'</h2><div class="detail-price">¥'+item.price+' '+escapeHtml(item.unit||"")+'</div>'+
    '<div class="detail-meta"><span>📂 '+escapeHtml(item.category)+'</span><span>🕐 '+escapeHtml(item.time)+'</span></div>'+
    '<div class="detail-desc">'+escapeHtml(item.desc||"暂无描述")+'</div>'+
    '<div class="detail-contact"><div class="label">联系方式</div><div class="info">'+escapeHtml(item.contact||"")+'</div></div>';
  document.getElementById("detailModal").style.display="flex";
}
function closeDetail(){document.getElementById("detailModal").style.display="none"}

function openPublish(){
  var sel=document.getElementById("formCategory");
  sel.innerHTML='<option value="">请选择分类</option>'+DATA.categories.filter(function(c){return c!=="全部"}).map(function(c){return'<option value="'+escapeJs(c)+'">'+escapeHtml(c)+'</option>'}).join("");
  editingIdx=-1; uploadedImage="";
  document.getElementById("uploadPreviewWrap").style.display="none";
  document.getElementById("addModal").style.display="flex";
}
function closePublish(){document.getElementById("addForm").reset();document.getElementById("addModal").style.display="none"}
function submitItem(e){
  e.preventDefault();
  var f=document.getElementById("addForm");
  var t=f.formTitle.value.trim(),c=f.formCategory.value,p=parseFloat(f.formPrice.value),u=f.formUnit.value.trim(),d=f.formDesc.value.trim(),ct=f.formContact.value.trim();
  if(!t||!c||isNaN(p)||p<0||p>CONFIG.MAX_PRICE||!ct){showToast("请填写所有必填项");return}
  var img=uploadedImage||"";
  if(editingIdx>=0){
    var old=DATA.items[editingIdx];
    DATA.items[editingIdx]={title:t,category:c,price:p,unit:u||"元",desc:d,contact:ct,time:old.time||"已编辑",image:img||old.image||""};
    syncToGitHub("✏️ 编辑: "+t);
  }else{
    DATA.items.unshift({title:t,category:c,price:p,unit:u||"元",desc:d,contact:ct,time:"刚刚",image:img});
    syncToGitHub("📝 发布: "+t);
  }
  items=DATA.items; uploadedImage=""; editingIdx=-1; closePublish(); saveLocal(); renderCatBar(); renderList();
}

function toggleAdmin(){
  if(isAdmin){isAdmin=false;updateAdminUI();renderCatBar();showToast("已退出管理模式");return}
  var pw=prompt("请输入管理密码：");
  if(pw===null||pw===""){return}
  sha256(pw).then(function(hash){
    if(hash===DATA.admin_pwd){isAdmin=true;updateAdminUI();renderCatBar();showToast("已进入管理模式")}
    else{showToast("密码错误")}
  });
}
function updateAdminUI(){
  var btns=[document.getElementById("btnChangePwd"),document.getElementById("btnExport")];
  for(var i=0;i<btns.length;i++){if(btns[i]) btns[i].style.display=isAdmin?"":"none";}
  var adminBtn=document.getElementById("btnAdmin");
  if(adminBtn){adminBtn.textContent=isAdmin?"⚙️ 退出管理":"⚙️ 管理";adminBtn.className=isAdmin?"btn-admin active":"btn-admin";}
}

}

}

function openPwdModal(){if(!isAdmin){showToast("请先进入管理模式");return}document.getElementById("pwdModal").style.display="flex"}
function closePwdModal(){document.getElementById("pwdForm").reset();document.getElementById("pwdModal").style.display="none"}
function changePwd(e){
  e.preventDefault();
  var o=document.getElementById("oldPwd").value,n=document.getElementById("newPwd").value.trim(),c=document.getElementById("confirmPwd").value.trim();
  if(n.length<CONFIG.MIN_PWD_LENGTH){alert("新密码至少"+CONFIG.MIN_PWD_LENGTH+"位");return}
  if(n!==c){alert("两次密码不一致");return}
  sha256(o).then(function(oldHash){
    if(oldHash!==DATA.admin_pwd){alert("当前密码错误");return}
    sha256(n).then(function(newHash){
      DATA.admin_pwd=newHash;closePwdModal();alert("密码已修改");syncToGitHub("🔑 修改管理密码");
    });
  });
}

function resetAll(){currentCat="全部";renderCatBar();renderList()}

function delItem(idx){
  if(!confirm("确定删除「"+DATA.items[idx].title+"」？")) return;
  DATA.items.splice(idx,1); items=DATA.items; saveLocal(); renderList();
  syncToGitHub("🗑️ 删除商品");
}

function editItem(idx){
  editingIdx=idx;
  var item=DATA.items[idx];
  if(!item) return;
  openPublish();
  document.getElementById("formTitle").value=item.title;
  document.getElementById("formCategory").value=item.category;
  document.getElementById("formPrice").value=item.price;
  document.getElementById("formUnit").value=item.unit||"";
  document.getElementById("formDesc").value=item.desc||"";
  document.getElementById("formContact").value=item.contact||"";
  if(item.image&&item.image.indexOf("data:")===0){uploadedImage=item.image;var p=document.getElementById("uploadPreviewWrap");var im=document.getElementById("uploadPreview");if(p&&im){im.src=item.image;p.style.display="block"}}
}

renderCatBar();renderList();
loadFromServer();setInterval(function(){loadFromServer()},CONFIG.SYNC_INTERVAL);

var searchTimer = null;
document.getElementById("searchInput").addEventListener("input", function () {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(renderList, CONFIG.SEARCH_DEBOUNCE);
});

// ==================== HTML onclick 别名 ====================
var openAddModal=openPublish, closeAddModal=closePublish;
var openChangePwdModal=openPwdModal, openShareModal=openShare, closeShareModal=closeShare;
var changePassword=changePwd;
var exportUserItems=function(){var j=JSON.stringify(DATA,null,2);var b=new Blob([j],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="sunny_backup.json";a.click();URL.revokeObjectURL(a.href)};
var manualSync=function(){syncToGitHub("🔄 手动同步").then(function(ok){if(ok){alert("✅ 同步成功，页面将刷新");location.reload()}else{alert("❌ 同步失败，请检查网络后重试")}})};
var setupToken=function(){showToast("GitHub Token 已内置 ✅")};

var previewImage=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){uploadedImage=ev.target.result;var p=document.getElementById("uploadPreviewWrap");var im=document.getElementById("uploadPreview");if(p&&im){im.src=uploadedImage;p.style.display="block"}};r.readAsDataURL(f)};
</script>
